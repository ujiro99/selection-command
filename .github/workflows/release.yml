name: Release

on:
  push:
    tags:
      - "*"
jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          # Full history and tags are needed to generate the release notes.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"
      - name: Install dependencies and build
        run: |
          yarn install --frozen-lockfile
          yarn build:extension
        env:
          CI: true
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
          VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
          VITE_API_SECRET: ${{ secrets.VITE_API_SECRET }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UPLOAD_SOURCEMAP_TO_SENTRY: "true"
      - name: Create zip package
        run: |
          mkdir -p packages/extension/build
          yarn workspace @selection-command/extension zip
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Changes since the previous tag that reach extension users.
          args: >-
            --latest --strip header
            --include-path "packages/extension/**"
            --include-path "packages/shared/**"
        env:
          OUTPUT: RELEASE_NOTES.md
          # Used by git-cliff to look up the pull request of each commit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "packages/extension/build/*.zip"
          bodyFile: RELEASE_NOTES.md
      # Ask selection-command-hub to open a draft PR of the What's New page.
      - name: Notify Hub of the release
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HUB_DISPATCH_TOKEN is not set; skipped notifying the Hub."
            exit 0
          fi
          gh api repos/ujiro99/selection-command-hub/dispatches \
            -f event_type=extension-released \
            -f "client_payload[version]=${TAG#v}"
