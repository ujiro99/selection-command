name: Check AI Service Selectors

# Daily check that the selectors in packages/hub/public/data/ai-services.json
# still match the live AI service pages.
#
# - Selector not found  -> open (or comment on) an issue, and fail the run.
# - Blocked / error     -> only fail the run. GitHub emails a failure
#                          notification to the user who last changed the
#                          schedule (or triggered the run manually).

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-ai-selectors
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # Must match the @playwright/test version resolved in yarn.lock;
      # otherwise the bundled browsers don't match and launching fails.
      # Keep it in sync with .github/workflows/test.yml.
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    env:
      ISSUE_LABEL: ai-selector-broken

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check selectors
        id: check
        working-directory: packages/extension
        run: yarn check:ai-selectors --headless
        env:
          # Classifies pages whose input was not found (challenge / login
          # page vs. broken selector). When not set, such pages are reported
          # as "unclassified" (no issue, only a failed run).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Write job summary
        if: always()
        run: cat packages/extension/selector-check-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-selector-check-results
          path: packages/extension/selector-check-results/
          retention-days: 14

      - name: Install GitHub CLI
        if: steps.check.outputs.broken == 'true'
        run: |
          type gh >/dev/null 2>&1 && exit 0
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh

      - name: Create or update issue
        if: steps.check.outputs.broken == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROKEN_SERVICES: ${{ steps.check.outputs.broken_services }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The daily selector check found selectors in \`packages/hub/public/data/ai-services.json\` that no longer match."
            echo "Please update the selectors."
            echo
            echo "- Broken services: \`${BROKEN_SERVICES}\`"
            echo "- Run: ${RUN_URL} (screenshots are in the run artifacts)"
            echo
            cat packages/extension/selector-check-results/summary.md
          } > issue-body.md

          gh label create "$ISSUE_LABEL" --color d73a4a \
            --description "ai-services.json selectors need to be fixed" 2>/dev/null || true

          # Reuse an open issue so that a long-lasting breakage doesn't
          # create a new issue every day.
          number=$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --label "$ISSUE_LABEL" \
              --title "ai-services.json のセレクタ修正が必要です (${BROKEN_SERVICES})" \
              --body-file issue-body.md
          fi

      - name: Fail on broken or blocked
        if: steps.check.outputs.broken == 'true' || steps.check.outputs.blocked == 'true'
        run: |
          echo "broken=${{ steps.check.outputs.broken }} blocked=${{ steps.check.outputs.blocked }}"
          exit 1
