<!doctype html>
<html translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Option Page</title>
    <!-- Sets data-sc-theme before the first paint. -->
    <script src="/theme-init.js"></script>
    <style>
      /*
       * Paint the dark background before the scripts and styles load, so a
       * dark-mode user does not see a white flash. theme-init.js has set
       * data-sc-theme by now; once global.css loads, it takes over.
       */
      html[data-sc-theme="dark"] {
        color-scheme: dark;
        background-color: hsl(224 71% 4%);
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/options_page.tsx"></script>
  </body>
</html>
