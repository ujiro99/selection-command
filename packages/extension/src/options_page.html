<!doctype html>
<html translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Option Page</title>
    <style>
      /*
       * Paint the dark background before the scripts and styles load, so a
       * dark-mode user does not see a white flash. Once useTheme sets
       * data-sc-theme, global.css takes over; an explicit light setting
       * opts out here.
       */
      @media (prefers-color-scheme: dark) {
        html:not([data-sc-theme="light"]) {
          color-scheme: dark;
          background-color: hsl(224 71% 4%);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/options_page.tsx"></script>
  </body>
</html>
